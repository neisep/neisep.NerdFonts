name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write   # required for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: 10.0.x   # test project targets net10.0

      # The README links on nuget.org point at the tag v<Version>; the tests check them against <Version>.
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/neisep.NerdFonts/neisep.NerdFonts.csproj)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version>"; exit 1; }

      # Build once with the release properties; pack reuses that build, so the tested DLL is the shipped DLL.
      - run: dotnet test neisep.NerdFonts.slnx -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >
          dotnet pack src/neisep.NerdFonts/neisep.NerdFonts.csproj -c Release -o out --no-build
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Verify the package contents and metadata
        run: tools/verify-package.sh out

      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841   # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}   # nuget.org profile name (not email)

      - run: dotnet nuget push "out/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
