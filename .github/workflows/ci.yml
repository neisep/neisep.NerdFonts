name: CI

# The same checks as publish.yml, without publishing, so a failure shows up before a release tag is pushed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9   # v4.3.1
        with:
          dotnet-version: 10.0.x   # test project targets net10.0

      - run: dotnet test neisep.NerdFonts.slnx -c Release -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: >
          dotnet pack src/neisep.NerdFonts/neisep.NerdFonts.csproj -c Release -o out --no-build
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg

      - name: Verify the package contents and metadata
        run: tools/verify-package.sh out
